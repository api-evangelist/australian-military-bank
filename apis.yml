  - url: openapi/australian-military-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right (CDR) Product Reference
    Data API exposing Australian Military Bank's retail banking product catalogue.
    Confirmed live at https://public.open.australianmilitarybank.com.au/cds-au/v1/banking/products
    (HTTP 200, x-v 3). Conforms to the DSB Consumer Data
    Standards Banking API (v1.36.0); provides GET /banking/products (list, filterable/paginated)
    and GET /banking/products/{productId} (product detail) with no authentication required.
- aid: australian-military-bank:australian-military-bank-cdr-accounts-balances-api
  name: Australian Military Bank CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Accounts
  - Balances
  - Consumer Authorized
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.australianmilitarybank.com.au/consumer-data-right
  baseURL: https://public.open.australianmilitarybank.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.australianmilitarybank.com.au/consumer-data-right
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-accounts
    type: APIReference
  - url: openapi/australian-military-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right (CDR) Accounts and Balances
    API. Part of the DSB Consumer Data Standards Banking API (v1.36.0) that Australian
    Military Bank is legally required to implement as an accredited data holder.
    Provides GET /banking/accounts (list accounts), GET /banking/accounts/balances
    (bulk balances), GET /banking/accounts/{accountId}/balance (single balance) and
    GET /banking/accounts/{accountId} (account detail). Unlike the public Product
    Reference Data endpoint, these endpoints return authenticated customer data and
    are only accessible to accredited data recipients (ADRs) through the CDR's
    FAPI-profiled OAuth2/OIDC consent flows over mutual-TLS.
