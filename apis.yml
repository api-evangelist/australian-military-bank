    type: APIReference
  - url: openapi/australian-military-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right (CDR) Transactions API. Part
    of the DSB Consumer Data Standards Banking API (v1.36.0) mandated for Australian
    Military Bank as an accredited data holder. Provides GET
    /banking/accounts/{accountId}/transactions (list transactions for an account,
    with date/amount/text filters and pagination) and GET
    /banking/accounts/{accountId}/transactions/{transactionId} (transaction detail).
    These return authenticated customer transaction data and are only accessible to
    accredited data recipients (ADRs) via the CDR's FAPI-profiled OAuth2/OIDC consent
    flows over mutual-TLS; they are not part of the public unauthenticated surface.
