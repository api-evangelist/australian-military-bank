name: Australian Military Bank
kind: company
description: Australian Military Bank Ltd (ABN 48 087 649 741, AFSL/Australian Credit
  Licence 237988, BSB 642170) is a customer-owned mutual authorised deposit-taking
  institution (ADI) that has served the Australian Defence Force community, veterans,
  and their families since 1959, making it one of Australia's longest-serving Defence
  financial institutions. As an active ADI it participates in Australia's Consumer
  Data Right (CDR) open banking regime, and its only public, unauthenticated API surface
  is the mandated Product Reference Data (PRD) API built to the Data Standards Body
  (DSB) Consumer Data Standards. Consumer data sharing (accounts, balances, transactions)
  is available only to accredited data recipients through the CDR's authenticated,
  FAPI-profiled OAuth2/OIDC flows; the bank does not publish a broader self-serve
  developer portal or proprietary API program.
